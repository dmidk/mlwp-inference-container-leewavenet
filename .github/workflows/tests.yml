# Run the CF metadata tests on every pull request and push to main.
#
# The tests build small synthetic datasets in a temporary directory, so
# they need neither the LeeWaveNet models nor access to DMI's S3.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      # cfchecker loads UDUNITS-2 through ctypes, so it needs the
      # system library and not just the Python package. Without it the
      # CF validation would be skipped rather than run.
      - name: Install UDUNITS-2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudunits2-0

      # Install the versions in uv.lock, including the dev group that
      # holds pytest and the CF checker.
      #
      # The tests cover metadata and I/O only: they import
      # leewavenet.cf_metadata and leewavenet.write_output, never the
      # inference code. Skipping torch, fastai and the CUDA libraries
      # therefore changes nothing about what is tested and keeps
      # several GB out of the runner. The container build in
      # container-image.yml installs the full environment.
      - name: Install the project without the GPU stack
        run: |
          uv sync --locked \
            --no-install-package torch \
            --no-install-package torchvision \
            --no-install-package triton \
            --no-install-package fastai \
            --no-install-package nvidia-cublas-cu12 \
            --no-install-package nvidia-cuda-cupti-cu12 \
            --no-install-package nvidia-cuda-nvrtc-cu12 \
            --no-install-package nvidia-cuda-runtime-cu12 \
            --no-install-package nvidia-cudnn-cu12 \
            --no-install-package nvidia-cufft-cu12 \
            --no-install-package nvidia-curand-cu12 \
            --no-install-package nvidia-cusolver-cu12 \
            --no-install-package nvidia-cusparse-cu12 \
            --no-install-package nvidia-nccl-cu12 \
            --no-install-package nvidia-nvjitlink-cu12 \
            --no-install-package nvidia-nvtx-cu12

      # LEEWAVENET_REQUIRE_CF_CHECKER turns a missing CF checker into a
      # failure instead of a skip, so the CF validation cannot quietly
      # stop running if the UDUNITS install above ever breaks.
      - name: Run the tests
        run: uv run --no-sync pytest -v
        env:
          LEEWAVENET_REQUIRE_CF_CHECKER: "1"
