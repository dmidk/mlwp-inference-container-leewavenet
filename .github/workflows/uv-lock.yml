name: uv lock check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check
